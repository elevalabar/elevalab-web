<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Contacto — Eleva Lab</title>
<meta name="description" content="Cómo contactar a Eleva Lab: Instagram @elevalab.ar, y próximamente GitHub, LinkedIn y CV.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="Contacto — Eleva Lab">
<meta property="og:description" content="Cómo contactar a Eleva Lab.">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<header class="nav-sitio" id="nav-sitio"></header>

<main>
  <section class="hero" style="padding-bottom:20px;">
    <div class="contenedor">
      <h1 style="font-size: clamp(32px, 5vw, 48px);">Contacto</h1>
      <p class="descripcion" style="margin-top:16px;">
        Eleva Lab todavía está en construcción. Hoy el canal más directo es Instagram.
      </p>
    </div>
  </section>

  <section class="envoltorio-seccion" style="padding-top:8px;">
    <div class="contenedor">
      <div class="panel-contacto" id="panel-contacto">
        <!-- Se completa por JS desde REDES en site.js -->
      </div>
    </div>
  </section>
</main>

<footer class="pie-sitio" id="pie-sitio"></footer>

<script src="../assets/js/site.js"></script>
<script>
  renderNavSitio('contacto', '../');
  renderFooterSitio('../');

  function filaContacto(nombre, detalle, url) {
    const valor = url
      ? `<a class="valor-canal" href="${url}" target="_blank" rel="noopener">Abrir</a>`
      : `<span class="valor-canal pendiente">Próximamente</span>`;
    return `
      <div class="fila-contacto">
        <div>
          <div class="nombre-canal">${nombre}</div>
          <div class="detalle-canal">${detalle}</div>
        </div>
        ${valor}
      </div>
    `;
  }

  document.getElementById('panel-contacto').innerHTML =
    filaContacto('Instagram', '@elevalab.ar', REDES.instagram) +
    filaContacto('GitHub', 'Repositorios de Eleva Lab', REDES.github) +
    filaContacto('LinkedIn', 'Sebastián Quiven', REDES.linkedin) +
    filaContacto('CV', 'Currículum de Sebastián Quiven', REDES.cv);
</script>
</body>
</html>
